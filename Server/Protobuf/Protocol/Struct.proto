syntax = "proto3";
package Protocol;

import "Enum.proto";

message BuffData
{
	uint64 buffId = 1;
	float remainTime = 2;
	repeated uint64 victims = 3;
}

message PlayerStat
{
    float max_hp = 1;
    float current_hp = 2;
    float max_mp = 3;
    float current_mp = 4;
    float attack = 5;
    float defense = 6;
    float speed = 7;
}

message ObjectInfo
{
	uint64 objectId = 1;
	string name = 2;
    PlayerStat stat = 3;
}
